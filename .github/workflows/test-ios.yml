name: Test iOS

# Runs the unit test suite on a simulator. Kept separate from the build
# workflow so a flaky simulator run never blocks IPA production.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: "Also run the slower, flakier UI test bundle"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: test-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PROJECT: HermesMobile.xcodeproj
  SCHEME: HermesMobile

jobs:
  test:
    name: Unit tests (simulator)
    runs-on: macos-26
    # Simulator runs are slow; bound them so a stall cannot burn an hour.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode not found at $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version

      - name: Pick and boot an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # Select a concrete UDID: name-based destinations are ambiguous when
          # several runtimes are installed, which can stall the test host.
          PICKED=$(python3 .github/scripts/pick-simulator.py) || {
            echo "::error::No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          }

          SIM_NAME=$(echo "$PICKED" | cut -d'|' -f1)
          SIM_UDID=$(echo "$PICKED" | cut -d'|' -f2)
          SIM_RUNTIME=$(echo "$PICKED" | cut -d'|' -f3)
          echo "Selected: $SIM_NAME ($SIM_RUNTIME) $SIM_UDID"
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"

          # Boot up front so the test run does not pay cold-boot cost.
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run unit tests
        run: |
          set -euo pipefail
          # Simulator builds use an ad-hoc signature ("-"). Turning signing off
          # entirely stops the test host from launching and hangs the run.
          #
          # -only-testing limits this to the unit-test bundle. The scheme also
          # lists HermesMobileUITests, which actually boots and drives the app
          # on the simulator -- far slower and flakier. UI tests are opted into
          # separately via a manual run.
          ONLY_TESTING=(-only-testing:HermesMobileTests)
          if [ "${{ github.event.inputs.include_ui_tests }}" = "true" ]; then
            ONLY_TESTING=()
          fi

          # macOS ships bash 3.2, where "${arr[@]}" on an empty array trips
          # `set -u`. Use the ${arr[@]+"${arr[@]}"} form so an empty array
          # expands to nothing instead of erroring.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ${ONLY_TESTING[@]+"${ONLY_TESTING[@]}"} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/test.log" | tail -120

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore
