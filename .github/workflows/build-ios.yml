name: Build iOS

# Produces an UNSIGNED .ipa plus the raw .app and dSYM as downloadable artifacts.
# Unsigned output is the correct input for SideStore / AltStore / Sideloadly,
# which re-sign on-device with your own Apple ID. No Apple Developer account
# or signing certificates are required to run this workflow.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options: [Release, Debug]

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match project.yml (xcodeVersion: "26.3").
  # macos-26 defaults to 26.6 and ships Xcode 26.3 at this path.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  APP_NAME: HermesMobile
  SCHEME: HermesMobile
  PROJECT: HermesMobile.xcodeproj

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select and verify toolchain
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode 26.3 not found at $DEVELOPER_DIR"
            echo "Available Xcode installs:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          echo "Selected SDK:"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true

      - name: Verify project.yml is not drifted from the committed .xcodeproj
        continue-on-error: true
        run: |
          set -euo pipefail
          # Non-fatal by design: this is a health check, not a gate.
          # We never let a regenerated project replace the committed one -
          # CI must build exactly what a contributor opens in Xcode.
          COMMITTED="$RUNNER_TEMP/committed.xcodeproj"
          rm -rf "$COMMITTED"
          cp -R "$PROJECT" "$COMMITTED"

          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "Installing xcodegen..."
            brew install xcodegen
          fi
          xcodegen --version

          xcodegen generate --spec project.yml --quiet || {
            echo "::warning::xcodegen failed to regenerate the project."
            rm -rf "$PROJECT"; cp -R "$COMMITTED" "$PROJECT"; exit 0
          }

          if diff -q "$COMMITTED/project.pbxproj" "$PROJECT/project.pbxproj" >/dev/null 2>&1; then
            echo "project.yml and the committed .xcodeproj are in sync."
          else
            echo "::warning::project.yml and the committed .xcodeproj differ (expected: xcodegen randomises some IDs). Building the committed project."
          fi

          # Restore the committed project unconditionally - the build uses this.
          rm -rf "$PROJECT"
          cp -R "$COMMITTED" "$PROJECT"
          echo "Committed .xcodeproj restored for the build."

      - name: Resolve Swift Package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"
          echo "Resolved packages:"
          find . -name Package.resolved -not -path './.git/*' -exec echo {} \; 2>/dev/null || true

      - name: Build app (unsigned)
        id: build
        run: |
          set -euo pipefail
          CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "configuration=$CONFIG" >> "$GITHUB_OUTPUT"

          DERIVED="$RUNNER_TEMP/DerivedData"
          mkdir -p "$DERIVED"

          # CODE_SIGNING_ALLOWED=NO gives a clean unsigned build with no team.
          # The entitlements (HealthKit, App Groups) and CarPlay scene are
          # deliberately left in place: SideStore re-signs and rewrites them.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

          APP_PATH="$DERIVED/Build/Products/$CONFIG-iphoneos/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected .app not found at $APP_PATH"
            find "$DERIVED/Build/Products" -maxdepth 3 -name '*.app' || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          # Strip any stray signature so SideStore starts from a clean slate.
          rm -rf "$STAGE/Payload/$APP_NAME.app/_CodeSignature"
          rm -f "$STAGE/Payload/$APP_NAME.app/embedded.mobileprovision"
          ( cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$APP_NAME-unsigned.ipa" Payload )
          echo "IPA contents:"
          unzip -l "$GITHUB_WORKSPACE/$APP_NAME-unsigned.ipa" | head -20
          ls -lh "$GITHUB_WORKSPACE/$APP_NAME-unsigned.ipa"

      - name: Package .app bundle
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.build.outputs.app_path }}"
          ( cd "$(dirname "$APP_PATH")" \
            && zip -qry "$GITHUB_WORKSPACE/$APP_NAME-unsigned-app.zip" "$APP_NAME.app" )
          ls -lh "$GITHUB_WORKSPACE/$APP_NAME-unsigned-app.zip"

      - name: Collect dSYMs
        # Never fail the job here: the IPA and .app are the deliverables.
        continue-on-error: true
        if: always()
        run: |
          set -uo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          PRODUCTS="$DERIVED/Build/Products"
          ZIP_PATH="$GITHUB_WORKSPACE/$APP_NAME-dSYMs.zip"

          # Two dSYM bundles are produced (app + widget extension), each with
          # identical internal paths (Contents/Resources/DWARF/...). Archive
          # them from a common parent WITHOUT flattening so every bundle keeps
          # its own directory structure and no member names collide.
          cd "$PRODUCTS"
          FOUND=$(find . -maxdepth 2 -name '*.dSYM' -type d | sed 's|^\./||' | sort)

          if [ -z "$FOUND" ]; then
            echo "No dSYMs produced (expected for Debug builds without debug info splitting)."
            exit 0
          fi

          echo "dSYM bundles found:"
          echo "$FOUND"
          rm -f "$ZIP_PATH"
          echo "$FOUND" | while IFS= read -r d; do
            echo "Archiving: $d"
            zip -qry "$ZIP_PATH" "$d"
          done

          if [ -f "$ZIP_PATH" ]; then
            ls -lh "$ZIP_PATH"
            echo "Contents:"
            unzip -l "$ZIP_PATH" | head -20
          else
            echo "::warning::dSYM zip was not created."
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Upload .app bundle
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-app-bundle
          path: ${{ env.APP_NAME }}-unsigned-app.zip
          if-no-files-found: error

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.APP_NAME }}-dSYMs
          path: ${{ env.APP_NAME }}-dSYMs.zip
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Hermes iOS build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Runner | \`macos-26\` |"
            echo "| Xcode | $(xcodebuild -version | head -1) |"
            echo "| Configuration | \`${{ steps.build.outputs.configuration }}\` |"
            echo "| Signing | Unsigned (re-sign with SideStore/AltStore) |"
            echo ""
            ls -lh "$APP_NAME-unsigned.ipa" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
